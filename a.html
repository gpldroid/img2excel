        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        code: ['Fira Code', 'monospace']

                        brand: {
                            50: '#f0f9ff',

                }

    <style>
        body { font-family: 'Cairo', sans-serif; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

        <div class="flex items-center gap-2 flex-wrap">
            <div class="relative">
                <select id="templateSelector" onchange="loadSelectedTemplate()" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2 outline-none focus:border-cyan-500 transition">
                    <option value="landing">🚀 متكامل: صفحة هبوط حديثة (Landing Page)</option>

                    <option value="dashboard">📊 متكامل: لوحة تحكم تفاعلية (Dashboard)</option>
                    <option value="portfolio">💼 متكامل: معرض أعمال شخصي (Portfolio)</option>
                    <option value="game">🎮 متكامل: لعبة ذاكرة تفاعلية (Memory Game)</option>
                </select>
            </div>

            <button onclick="runPreview()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg flex items-center gap-1.5 transition shadow-lg shadow-emerald-900/30">

            </button>

            <button onclick="downloadActiveFile()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 transition">

        window.onload = function() {
        function getBundledHTML() {
            saveCurrentCode();
            let htmlContent = projectFiles["index.html"] || "<h3>لا يوجد ملف index.html</h3>";

            // Inject CSS files into head
            Object.keys(projectFiles).forEach(file => {
                if (file.endsWith('.css') && file !== 'style.css') {
                    htmlContent = htmlContent.replace('</head>', `<style>/* ${file} */\n${projectFiles[file]}</style></head>`);
                }
            });

            if (projectFiles["style.css"]) {
                htmlContent = htmlContent.replace('</head>', `<style>/* style.css */\n${projectFiles["style.css"]}</style></head>`);
            }

            // Inject JS files before end of body
            Object.keys(projectFiles).forEach(file => {
                if (file.endsWith('.js') && file !== 'script.js' && file !== 'app.js') {
                    htmlContent = htmlContent.replace('</body>', `<script>/* ${file} */\n${projectFiles[file]}<\/script></body>`);
                }
            });

            if (projectFiles["data.js"]) {
                htmlContent = htmlContent.replace('</body>', `<script>/* data.js */\n${projectFiles["data.js"]}<\/script></body>`);
            }
            if (projectFiles["app.js"]) {
                htmlContent = htmlContent.replace('</body>', `<script>/* app.js */\n${projectFiles["app.js"]}<\/script></body>`);
            }
            if (projectFiles["script.js"]) {
                htmlContent = htmlContent.replace('</body>', `<script>/* script.js */\n${projectFiles["script.js"]}<\/script></body>`);
            }

            return htmlContent;
        }

        function runPreview() {
            const htmlContent = getBundledHTML();
            const iframe = document.getElementById('previewFrame');
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            iframe.src = URL.createObjectURL(blob);
        }

        function generateStandaloneLink() {
            const htmlContent = getBundledHTML();
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const previewUrl = URL.createObjectURL(blob);
            
            // Open full output in new tab
            const win = window.open(previewUrl, '_blank');
            if (!win) {
                alert("يرجى السماح بالنوافذ المنبثقة لفتح المعاينة المستقلة.");
            }
        }

        function downloadProjectZip() {
            saveCurrentCode();

            if (typeof JSZip === 'undefined') {
                alert("جاري تحميل مكتبة الضغط، يرجى المحاولة بعد ثوانٍ...");
                return;
            }

            const zip = new JSZip();

            // Add all project files into the ZIP structure according to their relative paths
            Object.keys(projectFiles).forEach(fileName => {
                zip.file(fileName, projectFiles[fileName]);
            });

            // Generate zip file and create download link
            zip.generateAsync({ type: "blob" }).then(function(content) {
                const downloadLink = document.createElement("a");
                downloadLink.href = URL.createObjectURL(content);
                downloadLink.download = "Project_Export_" + new Date().toISOString().slice(0, 10) + ".zip";
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            });
        }

        function downloadActiveFile() {
            saveCurrentCode();
            const content = projectFiles[activeFileName] || "";
            const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = activeFileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
