<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="معاينة ملفات Excel وCSV داخل المتصفح."><title>معاينة Excel - Img2Excel</title><link rel="stylesheet" href="/assets/css/style.css"><script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script></head><body style="font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a"><main style="max-width:1100px;margin:auto;padding:1rem"><h1>معاينة ملف Excel</h1><input id="file" type="file" accept=".xlsx,.xls,.csv"><div id="status"></div><div id="table" style="overflow:auto;margin-top:1rem"></div><p><a href="/index.html">العودة إلى الأداة</a></p></main><script>document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});document.getElementById('table').innerHTML=XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]]);document.getElementById('status').textContent='تمت المعاينة محليًا داخل المتصفح.'});</script></body></html>
